# SF-008: SecurityContextHolder 는 ThreadLocal 기반이라 JUnit 5 의 parallel
# execution 에서 stale auth 가 누수될 위험이 있다. 본 파일이 fixture 와
# resource 를 차지해 단일 thread 실행을 강제 — 안전이 검증되기 전까지 유지.
#
# 후속에서 parallel 로 전환하려면:
#   1) AbstractMvcTest 에 @ResourceLock("SECURITY_CONTEXT") 적용
#   2) SecurityContextHolder.MODE_INHERITABLETHREADLOCAL 동작 검증
#   3) 본 properties 의 default 를 concurrent 로 변경
junit.jupiter.execution.parallel.enabled = false
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = same_thread
