spring:
  application:
    name: terraworld-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/terraworld?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:terraworld}
    password: ${SPRING_DATASOURCE_PASSWORD:terraworld}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    # SEC-008: baseline-on-migrate is enabled ONLY in dev profile (see
    # application-prod.yml override below). In prod a missing history
    # table aborts startup so we notice accidental DB resets before V4
    # silently wipes user data.
    baseline-on-migrate: true
    baseline-version: "0"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

# SEC-009: profile-scoped CORS — dev includes localhost, prod does not.
# The allow-list is read by SecurityConfig which further refuses localhost
# entries when the prod profile is active.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://terraworld.app}

auth:
  jwks:
    # Public keys served by better-auth (Nuxt/Nitro). Spring fetches this on
    # startup and refreshes on unknown kid. better-auth rotates keys on its
    # own schedule; Spring follows automatically.
    #
    # SEC-012: the fallback here is dev-only. Set AUTH_JWKS_URL explicitly
    # in every non-local environment — the prod profile requires it.
    url: ${AUTH_JWKS_URL:http://localhost:3000/api/auth/jwks}
    refresh-cooldown-ms: ${AUTH_JWKS_REFRESH_COOLDOWN_MS:30000}
    negative-cache-ttl-ms: ${AUTH_JWKS_NEGATIVE_CACHE_TTL_MS:60000}
    max-response-bytes: ${AUTH_JWKS_MAX_RESPONSE_BYTES:65536}
  jwt:
    # Must match the `issuer` and `audience` set in frontend/server/lib/auth.ts
    # `definePayload`. Any mismatch rejects every token at verification time.
    issuer: ${AUTH_JWT_ISSUER:terraworld}
    audience: ${AUTH_JWT_AUDIENCE:terraworld-api}
  internal:
    # Shared token used by better-auth databaseHooks on the Nitro side to
    # call internal Spring endpoints (profile bootstrap on signup).
    # MUST match frontend INTERNAL_API_TOKEN exactly and MUST NOT be the
    # BETTER_AUTH_SECRET. Transferred out-of-band.
    token: ${INTERNAL_API_TOKEN:}

terraworld:
  # Burst-protection rate limiter. See RateLimitProperties.DEFAULT_RULES for
  # the per-endpoint defaults. Disable globally with TERRAWORLD_RATE_LIMIT_ENABLED=false
  # (e.g. in some test profiles).
  rate-limit:
    enabled: ${TERRAWORLD_RATE_LIMIT_ENABLED:true}
    # SEC-001: trust upstream X-Forwarded-For only when the deployment sits behind
    # a trusted reverse proxy that overwrites the header. Default OFF — anonymous
    # rate-limit subject falls back to remoteAddr of the connection.
    trust-forwarded-for: ${TERRAWORLD_RATE_LIMIT_TRUST_XFF:false}

# SF-005 follow-up: photoUrl 도메인 화이트리스트.
# RecordController.createRecord 가 받는 외부 URL 의 scheme/host/data MIME 을
# PhotoUrlValidator 가 검증해 임의 외부 URL / javascript: / file: 등을 400 으로 차단.
# 운영 단계에서 prod CDN 호스트 (cdn.terraworld.app 등) 를 환경변수로 좁혀 지정.
app:
  photo-url:
    allowed-schemes: ${APP_PHOTO_URL_SCHEMES:https,data}
    allowed-hosts: ${APP_PHOTO_URL_HOSTS:cdn.terraworld.app,terraworld.app}
    allowed-data-mimes: ${APP_PHOTO_URL_DATA_MIMES:image/jpeg,image/png,image/webp}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
---
# --- prod profile overrides ---
spring:
  config:
    activate:
      on-profile: prod

  flyway:
    baseline-on-migrate: false

auth:
  jwks:
    # No fallback — missing AUTH_JWKS_URL aborts startup in prod.
    url: ${AUTH_JWKS_URL}
  internal:
    # Missing INTERNAL_API_TOKEN aborts startup in prod.
    token: ${INTERNAL_API_TOKEN}

cors:
  # Missing CORS_ALLOWED_ORIGINS aborts startup in prod. Never include
  # localhost entries — SecurityConfig enforces this at boot.
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
