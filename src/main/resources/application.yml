spring:
  application:
    name: terraworld-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/terraworld?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:terraworld}
    password: ${SPRING_DATASOURCE_PASSWORD:terraworld}
    driver-class-name: org.postgresql.Driver
    # BE-14 (2026-07-15 성능 감사): pool 크기를 명시 고정 (Hikari 기본값 10 과 동일 — 암묵 의존 제거)
    # + leak-detection 으로 "커넥션 30초 이상 미반납" 을 WARN 으로 가시화 (BE-01 류
    # tx-내-외부-HTTP 패턴 재발 시 운영 로그에서 즉시 검출).
    hikari:
      maximum-pool-size: 10
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        # BE-12 (2026-07-15 성능 감사): JDBC batching. PK 전략이 IDENTITY 라 INSERT batching 은
        # Hibernate 가 비활성(즉시 INSERT 로 id 획득) — UPDATE/DELETE batching 만 유효
        # (예: GrowthService.advanceAllStreaks 의 saveAll 갱신 N건 → 1 batch round-trip).
        # order_inserts/order_updates: 같은 테이블 statement 를 인접 정렬해 batch 성립률 향상.
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    # SEC-008: baseline-on-migrate is enabled ONLY in dev profile (see
    # application-prod.yml override below). In prod a missing history
    # table aborts startup so we notice accidental DB resets before V4
    # silently wipes user data.
    baseline-on-migrate: true
    baseline-version: "0"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

# SEC-009: profile-scoped CORS — dev includes localhost, prod does not.
# The allow-list is read by SecurityConfig which further refuses localhost
# entries when the prod profile is active.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://terraworld.app}

auth:
  jwks:
    # Public keys served by better-auth (Nuxt/Nitro). Spring fetches this on
    # startup and refreshes on unknown kid. better-auth rotates keys on its
    # own schedule; Spring follows automatically.
    #
    # SEC-012: the fallback here is dev-only. Set AUTH_JWKS_URL explicitly
    # in every non-local environment — the prod profile requires it.
    url: ${AUTH_JWKS_URL:http://localhost:3000/api/auth/jwks}
    refresh-cooldown-ms: ${AUTH_JWKS_REFRESH_COOLDOWN_MS:30000}
    negative-cache-ttl-ms: ${AUTH_JWKS_NEGATIVE_CACHE_TTL_MS:60000}
    max-response-bytes: ${AUTH_JWKS_MAX_RESPONSE_BYTES:65536}
  jwt:
    # Must match the `issuer` and `audience` set in frontend/server/lib/auth.ts
    # `definePayload`. Any mismatch rejects every token at verification time.
    issuer: ${AUTH_JWT_ISSUER:terraworld}
    audience: ${AUTH_JWT_AUDIENCE:terraworld-api}
  internal:
    # Shared token used by better-auth databaseHooks on the Nitro side to
    # call internal Spring endpoints (profile bootstrap on signup).
    # MUST match frontend INTERNAL_API_TOKEN exactly and MUST NOT be the
    # BETTER_AUTH_SECRET. Transferred out-of-band.
    token: ${INTERNAL_API_TOKEN:}

terraworld:
  # H6 fix: PlayBillingWebhookController 는 @Value("${terraworld.internal-api-token}") 를
  # 읽는다. auth.internal.token 과 동일한 INTERNAL_API_TOKEN env 로 통일해 운영에서
  # 한쪽만 주입돼 webhook 토큰이 빈값이 되는 상황(prod boot-fail / non-prod 401-only)을 방지.
  internal-api-token: ${INTERNAL_API_TOKEN:}

  # Burst-protection rate limiter. See RateLimitProperties.DEFAULT_RULES for
  # the per-endpoint defaults. Disable globally with TERRAWORLD_RATE_LIMIT_ENABLED=false
  # (e.g. in some test profiles).
  rate-limit:
    enabled: ${TERRAWORLD_RATE_LIMIT_ENABLED:true}
    # SEC-001: trust upstream X-Forwarded-For only when the deployment sits behind
    # a trusted reverse proxy that overwrites the header. Default OFF — anonymous
    # rate-limit subject falls back to remoteAddr of the connection.
    trust-forwarded-for: ${TERRAWORLD_RATE_LIMIT_TRUST_XFF:false}

# SF-005 follow-up: photoUrl 도메인 화이트리스트.
# RecordController.createRecord 가 받는 외부 URL 의 scheme/host/data MIME 을
# PhotoUrlValidator 가 검증해 임의 외부 URL / javascript: / file: 등을 400 으로 차단.
# 운영 단계에서 prod CDN 호스트 (cdn.terraworld.app 등) 를 환경변수로 좁혀 지정.
app:
  photo-url:
    allowed-schemes: ${APP_PHOTO_URL_SCHEMES:https,data}
    allowed-hosts: ${APP_PHOTO_URL_HOSTS:cdn.terraworld.app,terraworld.app}
    allowed-data-mimes: ${APP_PHOTO_URL_DATA_MIMES:image/jpeg,image/png,image/webp}
  # N-B7 점검 모드 (아프젝 v2): true 면 MaintenanceFilter 가 /api/** 에 503 {code:"MAINTENANCE"} 를 반환한다 (actuator 제외).
  maintenance: ${APP_MAINTENANCE:false}

# N9 (구현 계획서 v4, 2026-05-26): 광고 보상 nonce 정책.
# - 2026-06-23: 기본값 true 전환 (사용자 결정). frontend(useAdMob.generateNonce + onClaimAdReward)는
#   광고 시청 직전 nonce 를 발급해 항상 전송하므로 정상 흐름 무영향. nonce 미제공 호출은 위조 의심으로 차단.
# - true 이면 RewardService.claimAdReward 가 nonce 미제공 시 400 INVALID_INPUT 차단(위조 replay 방어).
# - 레거시 nonce-less 경로가 꼭 필요하면 REWARD_AD_NONCE_REQUIRED=false 로 명시 override.
reward:
  ad:
    nonce:
      required: ${REWARD_AD_NONCE_REQUIRED:true}

# 아프젝 v2 (2026-08-23) — 출석 보드 / 초대 루비 / 습관 보상 / 키우기 사이클 설정.
# 계약 SoT: docs/root/plans/2026-08-23-apjek-v2-api-contract.md (rev2). 바인딩 클래스는 각 도메인 패키지의
# *Properties (AttendanceProperties / InviteRewardProperties / HabitProperties / GrowthProperties).
attendance:
  board:
    # 7일 사이클 일차별 기본 코인 (day 1~7, 정확히 7개)
    coins: ${ATTENDANCE_BOARD_COINS:10,20,30,40,50,60,70}
  # 7일차 체크인 시 추가 지급 루비
  cycle-bonus-ruby: ${ATTENDANCE_CYCLE_BONUS_RUBY:5}

invite:
  reward:
    inviter-ruby: ${INVITE_REWARD_INVITER_RUBY:30}
    invitee-ruby: ${INVITE_REWARD_INVITEE_RUBY:10}

habit:
  reward:
    # solo 완주(또는 상대 중단 시) / 친구 습관 완주 시 양측 각각
    solo-sparkle: ${HABIT_REWARD_SOLO_SPARKLE:100}
    partner-sparkle: ${HABIT_REWARD_PARTNER_SPARKLE:200}
  # 친구 시작/연장 요청 만료 일수
  request-expiry-days: ${HABIT_REQUEST_EXPIRY_DAYS:7}

growth:
  # LOST 판정 시작 간격: DAYS.between(lastProgressDate, today) >= N (기본 2 = D+2 00:00 KST 부터)
  lost-after-days: ${GROWTH_LOST_AFTER_DAYS:2}
  # 루비 되살리기 비용
  revive-ruby-cost: ${GROWTH_REVIVE_RUBY_COST:10}
  # 사이클 목표 스탬프 수 (단계 시드 1/10/20 과 별개)
  goal: ${GROWTH_GOAL:30}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
---
# --- prod profile overrides ---
spring:
  config:
    activate:
      on-profile: prod

  flyway:
    baseline-on-migrate: false

  datasource:
    # review LOW: 기본 프로파일의 dev fallback(password 'terraworld')이 prod 로 새지 않도록
    # fallback 제거 — 미주입 시 placeholder 미해결로 부팅 abort (auth/cors 하드닝과 동일 패턴).
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

auth:
  jwks:
    # No fallback — missing AUTH_JWKS_URL aborts startup in prod.
    url: ${AUTH_JWKS_URL}
  internal:
    # Missing INTERNAL_API_TOKEN aborts startup in prod.
    token: ${INTERNAL_API_TOKEN}

cors:
  # Missing CORS_ALLOWED_ORIGINS aborts startup in prod. Never include
  # localhost entries — SecurityConfig enforces this at boot.
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

terraworld:
  # H6: prod 에서 INTERNAL_API_TOKEN 미주입 시 fail-fast (auth.internal.token 과 동일 env).
  # PlayBillingWebhookController.@PostConstruct 가 빈 문자열 감지 시 부팅 abort.
  internal-api-token: ${INTERNAL_API_TOKEN}

# N9: prod 광고 보상 nonce 강제 (2026-06-23 기본값 true). 미설정 시 default true.
# 레거시 nonce-less 경로가 필요하면 REWARD_AD_NONCE_REQUIRED=false 로 명시 override.
reward:
  ad:
    nonce:
      required: ${REWARD_AD_NONCE_REQUIRED:true}
