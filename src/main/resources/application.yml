spring:
  application:
    name: terraworld-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/terraworld
    username: terraworld
    password: terraworld
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

jwt:
  secret: terraworld-dev-secret-key-change-in-production-min-256-bits-required!!
  access-expiration: 3600000    # 1 hour
  refresh-expiration: 604800000 # 7 days

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
