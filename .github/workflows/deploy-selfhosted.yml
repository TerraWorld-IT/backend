name: Deploy (self-hosted Mac)

# 맥 self-hosted 러너에서 로컬 재빌드 + 재배포 (Cloudflare Tunnel 호스팅).
# 공인 IP/SSH 불가 환경이라 클라우드 러너+SSH 대신 맥 러너가 로컬 스택을 갱신한다.
# push(main) 전용 — fork PR 에서는 절대 실행 안 함(self-hosted 보안).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-selfhosted
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, terraworld]
    steps:
      - name: Rebuild jar + image, redeploy backend
        env:
          # openapi-backend 서브모듈은 별도 private repo(TerraWorld-IT/openapi-backend)라
          # GITHUB_TOKEN 으로는 fetch 불가 — CI(ci.yml)와 동일하게 PAT 을 주입한다.
          # (frontend deploy-selfhosted.yml 의 OPENAPI_FRONTEND_TOKEN 과 동일 방식)
          OPENAPI_SUBMODULE_TOKEN: ${{ secrets.OPENAPI_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin"
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          BE=/Users/jaeseok/TerraWorld-IT/backend
          DEPLOY=/Users/jaeseok/TerraWorld-IT/deploy

          cd "$BE"
          git fetch origin
          git reset --hard origin/main
          # 서브모듈 fetch 만 토큰 필요(위 origin fetch/reset 은 Mac 로컬 자격증명으로 동작).
          # 토큰은 argv 노출을 피해 GIT_CONFIG_* env 로 전달하고, insteadOf 는 이 git 호출(및
          # 서브모듈 자식 프로세스)에만 스코프되어 Mac 전역 gitconfig 에 남지 않는다.
          if [ -z "${OPENAPI_SUBMODULE_TOKEN:-}" ]; then
            echo "❌ OPENAPI_SUBMODULE_TOKEN 시크릿 미설정 — 서브모듈 fetch 불가"; exit 1
          fi
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="url.https://x-access-token:${OPENAPI_SUBMODULE_TOKEN}@github.com/.insteadOf" \
          GIT_CONFIG_VALUE_0="https://github.com/" \
          git submodule update --init --recursive
          ./gradlew bootJar -x test --no-daemon

          docker build -t ghcr.io/terraworld-it/terraworld-backend:latest .

          cd "$DEPLOY"
          docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --no-deps backend

          echo "backend healthy 대기..."
          for i in $(seq 1 24); do
            s=$(docker inspect --format '{{.State.Health.Status}}' tw-backend 2>/dev/null || echo n/a)
            [ "$s" = healthy ] && { echo "✅ backend healthy"; exit 0; }
            sleep 5
          done
          echo "❌ backend not healthy"; docker logs --tail 50 tw-backend; exit 1
