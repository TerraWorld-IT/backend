name: Deploy (self-hosted Mac)

# 맥 self-hosted 러너에서 로컬 재빌드 + 재배포 (Cloudflare Tunnel 호스팅).
# 공인 IP/SSH 불가 환경이라 클라우드 러너+SSH 대신 맥 러너가 로컬 스택을 갱신한다.
# push(main) 전용 — fork PR 에서는 절대 실행 안 함(self-hosted 보안).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-selfhosted
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, terraworld]
    steps:
      - name: Rebuild jar + image, redeploy backend
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin"
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          BE=/Users/jaeseok/TerraWorld-IT/backend
          DEPLOY=/Users/jaeseok/TerraWorld-IT/deploy

          cd "$BE"
          git fetch origin
          git reset --hard origin/main
          git submodule update --init --recursive
          ./gradlew bootJar -x test --no-daemon

          docker build -t ghcr.io/terraworld-it/terraworld-backend:latest .

          cd "$DEPLOY"
          docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --no-deps backend

          echo "backend healthy 대기..."
          for i in $(seq 1 24); do
            s=$(docker inspect --format '{{.State.Health.Status}}' tw-backend 2>/dev/null || echo n/a)
            [ "$s" = healthy ] && { echo "✅ backend healthy"; exit 0; }
            sleep 5
          done
          echo "❌ backend not healthy"; docker logs --tail 50 tw-backend; exit 1
