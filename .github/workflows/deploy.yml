name: Backend Deploy

# ⚠️ legacy 수동 경로 (2026-07-15 dispatch 전용으로 강등).
# 실 배포 경로는 ci.yml("Backend CI")의 build-push-image → deploy job (self-hosted 맥).
# 이 워크플로의 SSH/registry 배포는 REGISTRY_* / DEPLOY_* 시크릿이 설정된 적 없어
# workflow_run 트리거 시절 매 main push 마다 "Username and password required" 로
# 실패하며 러너 분만 태웠다 (07-06~07-15 전 run 실패 실측). SSH 배포 대상이 생기면
# 시크릿 설정 후 dispatch 로 사용하거나, 영구히 불필요해지면 삭제할 것.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "재배포할 Backend CI workflow run ID (backend-build 아티팩트를 가진 run)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download backend build artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: build/libs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}

      - name: Build Docker image
        run: docker build -t terraworld-backend:${{ github.event.workflow_run.head_sha || github.sha }} .

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker image
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          docker tag terraworld-backend:$SHA ${{ secrets.REGISTRY_URL }}/terraworld-backend:$SHA
          docker tag terraworld-backend:$SHA ${{ secrets.REGISTRY_URL }}/terraworld-backend:latest
          docker push ${{ secrets.REGISTRY_URL }}/terraworld-backend:$SHA
          docker push ${{ secrets.REGISTRY_URL }}/terraworld-backend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/terraworld
            docker compose pull backend
            docker compose up -d backend
