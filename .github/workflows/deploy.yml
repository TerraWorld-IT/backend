name: Backend Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew bootJar

      - name: Build Docker image
        run: docker build -t terraworld-backend:${{ github.sha }} .

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag terraworld-backend:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/terraworld-backend:${{ github.sha }}
          docker tag terraworld-backend:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/terraworld-backend:latest
          docker push ${{ secrets.REGISTRY_URL }}/terraworld-backend:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_URL }}/terraworld-backend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/terraworld
            docker compose pull backend
            docker compose up -d backend
