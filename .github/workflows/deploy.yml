name: Backend Deploy

# ci.yml("Backend CI")이 main 에서 성공적으로 끝난 뒤에만 배포한다.
# ci.yml 이 이미 backend-build 아티팩트(jar)를 업로드하므로 여기서 ./gradlew bootJar 를
# 다시 돌리지 않고 그 아티팩트를 그대로 받아 쓴다 (같은 커밋 gradle 빌드 중복 제거).
# 부수 효과: CI 가 실패(테스트/린트 실패 등)하면 배포도 자동으로 안 실행된다 (의도된 게이트).
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "재배포할 Backend CI workflow run ID (backend-build 아티팩트를 가진 run)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download backend build artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: build/libs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}

      - name: Build Docker image
        run: docker build -t terraworld-backend:${{ github.event.workflow_run.head_sha || github.sha }} .

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker image
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          docker tag terraworld-backend:$SHA ${{ secrets.REGISTRY_URL }}/terraworld-backend:$SHA
          docker tag terraworld-backend:$SHA ${{ secrets.REGISTRY_URL }}/terraworld-backend:latest
          docker push ${{ secrets.REGISTRY_URL }}/terraworld-backend:$SHA
          docker push ${{ secrets.REGISTRY_URL }}/terraworld-backend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/terraworld
            docker compose pull backend
            docker compose up -d backend
