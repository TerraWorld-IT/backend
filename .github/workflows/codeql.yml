# UltraPlan v3 S-AUDIT-001 (2026-05-18, HIGH — Codex post-audit 격상)
# 권장 default (§4.2.A 자율 진행): CodeQL (GitHub native, free).
# 출시 후 사용자 결정에 따라 Snyk (dep 보안) / OWASP ZAP (DAST) 보강 가능.

name: CodeQL Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 03:00 KST (UTC 18:00 일요일) — full scan
    - cron: '0 18 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']  # backend = Kotlin JVM

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # openapi-backend 는 같은 org 의 private submodule (composite build).
          # 미체크아웃 시 ':runtimeClasspath' 에서 io.terraworld:openapi-backend
          # 해소 실패로 Gradle assemble 이 깨진다 (ci.yml 과 동일 설정).
          submodules: recursive
          token: ${{ secrets.OPENAPI_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # ci.yml 과 동일 — 부재 시 매 스캔마다 의존성 전체 재다운로드 + 콜드 컴파일
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 권장 default: extended query suite — CRITICAL + HIGH + MEDIUM
          queries: security-extended,security-and-quality
          # CodeQL extractor 가 runner RAM 의 ~90% 를 선점하면 Kotlin 컴파일러
          # worker 가 굶어 GC overhead OOM → 6GB 로 제한해 빌드에 여유 확보.
          ram: 6144

      - name: Build (Gradle)
        run: ./gradlew --no-daemon assemble
        env:
          # Gradle daemon + Kotlin 컴파일 worker heap 확보 (기본 512m~1g 는 부족).
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

      # 본 결과는 GitHub Security 탭에서 확인. Critical 발견 시 PR block.
