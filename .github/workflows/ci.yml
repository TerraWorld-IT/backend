name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # openapi-backend is a private submodule in the same org.
          # GITHUB_TOKEN is scoped to this repo only, so a PAT with `repo` scope
          # that can read TerraWorld-IT/openapi-backend must be stored as
          # OPENAPI_SUBMODULE_TOKEN (see: Settings → Secrets → Actions).
          submodules: recursive
          token: ${{ secrets.OPENAPI_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check openapi-backend submodule freshness
        # openapi-backend 가 main 의 latest commit 보다 뒤처져 있으면 경고.
        # spec 드리프트 조기 감지용. 현재는 warning, 추후 fail 로 전환 예정.
        run: |
          cd openapi-backend
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            echo "::warning::openapi-backend remote main SHA를 가져올 수 없습니다 (PAT 권한 또는 네트워크 문제)."
          elif [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::warning title=Spec drift detected::openapi-backend submodule이 main 의 최신 상태가 아닙니다. local=$LOCAL_SHA remote=$REMOTE_SHA"
          else
            echo "openapi-backend submodule은 main 의 최신 상태입니다. ($LOCAL_SHA)"
          fi
        continue-on-error: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Test
        # `./gradlew test` 가 finalizedBy 로 jacocoTestReport 도 자동 실행한다.
        # 전 테스트가 mock 기반 유닛 테스트 (@SpringBootTest/@DataJpaTest 0건) — 실 DB/Redis 불필요.
        # FlywayMigrationSmokeTest 만 실 Postgres 를 쓰지만 자체 Testcontainers PostgreSQLContainer 를
        # 별도로 기동하므로 여기서 datasource env 를 줄 필요가 없다.
        run: ./gradlew test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-${{ github.sha }}
          path: build/reports/jacoco/test/
          retention-days: 14

      - name: Build
        run: ./gradlew bootJar

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: build/libs/*.jar
          retention-days: 7
