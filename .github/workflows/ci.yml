name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: terraworld_test
          POSTGRES_USER: terraworld
          POSTGRES_PASSWORD: terraworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # openapi-backend is a private submodule in the same org.
          # GITHUB_TOKEN is scoped to this repo only, so a PAT with `repo` scope
          # that can read TerraWorld-IT/openapi-backend must be stored as
          # OPENAPI_SUBMODULE_TOKEN (see: Settings → Secrets → Actions).
          submodules: recursive
          token: ${{ secrets.OPENAPI_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck --if-present || true

      - name: Test
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/terraworld_test
          SPRING_DATASOURCE_USERNAME: terraworld
          SPRING_DATASOURCE_PASSWORD: terraworld

      - name: Build
        run: ./gradlew bootJar

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: build/libs/*.jar
          retention-days: 7
