name: Backend CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # 수동 재배포 경로 (구 deploy-selfhosted.yml 의 workflow_dispatch 대체) —
  # main 에서 dispatch 하면 CI 통과 후 build-push-image → deploy 까지 이어진다.
  workflow_dispatch:

# 연속 push 시 구식 커밋 빌드 취소 (frontend/mobile CI 와 정합).
# 단 main 은 cancel 금지 — 배포 job(컨테이너 교체)이 중간에 죽으면 안 됨. 연속 push 는 큐잉.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/terraworld-it/terraworld-backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # openapi-backend is a private submodule in the same org.
          # GITHUB_TOKEN is scoped to this repo only, so a PAT with `repo` scope
          # that can read TerraWorld-IT/openapi-backend must be stored as
          # OPENAPI_SUBMODULE_TOKEN (see: Settings → Secrets → Actions).
          submodules: recursive
          token: ${{ secrets.OPENAPI_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check openapi-backend submodule freshness
        # openapi-backend 가 main 의 latest commit 보다 뒤처져 있으면 경고.
        # spec 드리프트 조기 감지용. 현재는 warning, 추후 fail 로 전환 예정.
        run: |
          cd openapi-backend
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            echo "::warning::openapi-backend remote main SHA를 가져올 수 없습니다 (PAT 권한 또는 네트워크 문제)."
          elif [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::warning title=Spec drift detected::openapi-backend submodule이 main 의 최신 상태가 아닙니다. local=$LOCAL_SHA remote=$REMOTE_SHA"
          else
            echo "openapi-backend submodule은 main 의 최신 상태입니다. ($LOCAL_SHA)"
          fi
        continue-on-error: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Test
        # `./gradlew test` 가 finalizedBy 로 jacocoTestReport 도 자동 실행한다.
        # 전 테스트가 mock 기반 유닛 테스트 (@SpringBootTest/@DataJpaTest 0건) — 실 DB/Redis 불필요.
        # FlywayMigrationSmokeTest 만 실 Postgres 를 쓰지만 자체 Testcontainers PostgreSQLContainer 를
        # 별도로 기동하므로 여기서 datasource env 를 줄 필요가 없다.
        run: ./gradlew test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-${{ github.sha }}
          path: build/reports/jacoco/test/
          retention-days: 14

      - name: Build
        run: ./gradlew bootJar

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: build/libs/*.jar
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 배포 (구 deploy-selfhosted.yml 통합, 2026-07-15)
  #
  # 이전 구조의 문제: 별도 push-트리거 워크플로가 CI 와 병렬로 맥 러너에서
  # `git reset --hard` + `bootJar -x test` + docker build 를 수행 —
  # (a) 테스트를 우회한 jar 가 CI 결과와 무관하게 프로덕션 직행
  # (b) OOM 이력 있는 맥에서 Kotlin 컴파일 + docker build 반복
  # (c) CI 가 이미 만든 테스트 통과 jar 아티팩트와 중복 빌드
  #
  # 새 구조: `needs` 체인으로 같은 run = 같은 SHA 보장. jar 는 플랫폼 무관이라
  # CI 아티팩트 재사용이 안전 (frontend 의 .output 과 다름). 이미지는 ubuntu 에서
  # 빌드해 ghcr 로 push, 맥은 pull 후 컨테이너 교체만 (frontend 와 동일 모델).
  # push(main) 전용 — fork PR 에서는 절대 실행 안 함(self-hosted 보안).
  # ───────────────────────────────────────────────────────────────────────────
  build-push-image:
    name: Build image (ubuntu) → ghcr
    needs: test-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # Dockerfile 은 jar COPY 뿐이라 서브모듈 불필요 — 얕은 checkout 으로 충분.
      - uses: actions/checkout@v4

      - name: Download tested jar from this run
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: build/libs/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest 는 compose 가 참조하는 태그, :<sha> 는 롤백용.
      - name: Build and push image
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    name: Pull and restart (self-hosted Mac)
    needs: build-push-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, terraworld]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull image and restart backend
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin"
          # 미설정만 기존 경로로 폴백한다. 명시된 잘못된 값은 다른 디렉터리 배포를 막기 위해 실패시킨다.
          DEFAULT_DEPLOY=/Users/jaeseok/TerraWorld-IT/deploy
          if [ "${TERRAWORLD_DEPLOY_DIR+x}" = x ]; then
            DEPLOY=$TERRAWORLD_DEPLOY_DIR
          else
            DEPLOY=$DEFAULT_DEPLOY
            printf '%s\n' 'TERRAWORLD_DEPLOY_DIR 미설정: 기존 호스트 배포 경로를 사용합니다.'
          fi
          case "$DEPLOY" in
            *[![:space:]]*) ;;
            *) printf '%s\n' '::error::TERRAWORLD_DEPLOY_DIR가 비어 있거나 공백뿐입니다.'; exit 1 ;;
          esac
          case "$DEPLOY" in
            /*) ;;
            *) printf '%s\n' '::error::TERRAWORLD_DEPLOY_DIR는 ~ 또는 상대 경로가 아닌 절대 경로여야 합니다.'; exit 1 ;;
          esac
          case "$DEPLOY" in
            *[!A-Za-z0-9._/:+@=-]*)
              printf '%s\n' '::error::TERRAWORLD_DEPLOY_DIR에 허용되지 않은 문자가 있습니다. 공백, 따옴표, $, 백틱은 사용할 수 없습니다.'
              exit 1
              ;;
          esac
          [ -d "$DEPLOY" ] || { printf '%s\n' '::error::TERRAWORLD_DEPLOY_DIR 디렉터리가 존재하지 않습니다.'; exit 1; }
          [ -f "$DEPLOY/docker-compose.yml" ] || { printf '%s\n' '::error::TERRAWORLD_DEPLOY_DIR에 docker-compose.yml이 없습니다.'; exit 1; }

          # 비대화형 맥 러너는 osxkeychain 잠김으로 `docker login` 불가 —
          # frontend deploy 와 동일하게 임시 DOCKER_CONFIG 에 auth 직접 기록.
          TMPCFG="$(mktemp -d)"
          trap 'rm -rf "$TMPCFG"' EXIT
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -s "$HOME/.docker/cli-plugins" "$TMPCFG/cli-plugins"
          fi
          GHCR_AUTH="$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')"
          umask 077
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$GHCR_AUTH" > "$TMPCFG/config.json"
          unset GHCR_AUTH
          export DOCKER_CONFIG="$TMPCFG"
          docker compose version >/dev/null || { echo "❌ docker compose 플러그인을 찾지 못함"; exit 1; }

          cd "$DEPLOY"
          docker compose -f docker-compose.yml -f docker-compose.tunnel.yml pull backend
          docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --no-deps backend

          echo "backend healthy 대기..."
          # 300초 예산 — 맥은 amd64 이미지를 Rosetta 에뮬레이션으로 실행해 Spring 부팅이
          # ~100초 걸린다 (2026-07-15 실측 96.1s Started). 구 120초 예산은 부팅 완료 직후
          # docker healthcheck 가 healthy 로 판정하기 전에 만료되어 false-negative 를 냈다
          # (앱은 정상 기동·서빙 중인데 deploy job 만 실패).
          for i in $(seq 1 60); do
            s=$(docker inspect --format '{{.State.Health.Status}}' tw-backend 2>/dev/null || echo n/a)
            [ "$s" = healthy ] && { echo "✅ backend healthy"; exit 0; }
            sleep 5
          done
          echo "❌ backend not healthy"; docker logs --tail 50 tw-backend; exit 1
